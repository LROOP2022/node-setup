# Все версии компонентов закреплены здесь. После изменения версии на уже
# работающем кластере роли ничего не обновят (установка "если нет"):
# для хакатона кластер пересоздаётся с нуля, это известный техдолг.

# --- k3s ---
k3s_version: "v1.35.9+k3s1"
k3s_api_port: 6443
k3s_flannel_backend: "wireguard-native"
k3s_token: "{{ vault_k3s_token }}"

# --- Компоненты платформы (устанавливаются на k3s_server) ---
ingress_nginx_version: "controller-v1.15.1"
cert_manager_version: "v1.21.2"
sealed_secrets_version: "v0.40.0"
argocd_version: "v3.5.3"

# Платформенные компоненты закреплены на ноде с этой меткой (node-1)
platform_node_role: "platform"

# --- Let's Encrypt ---
letsencrypt_email: "{{ vault_letsencrypt_email }}"

# --- GitOps ---
hack_manifests_repo: "https://github.com/LROOP2022/hack-manifests.git"
hack_manifests_branch: "main"
root_app_manifest_url: "https://raw.githubusercontent.com/LROOP2022/hack-manifests/{{ hack_manifests_branch }}/root-application.yml"

# --- Куда класть результаты на рабочей машине ---
artifacts_dir: "{{ playbook_dir }}/../artifacts"
