[defaults]
inventory = inventories/hack/hosts
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False

# Новые серверы: принять ключ хоста при первом подключении, дальше проверять
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
