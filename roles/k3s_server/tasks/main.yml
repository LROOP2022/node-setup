- name: Проверить, что токен кластера задан и достаточно длинный
  ansible.builtin.assert:
    that: k3s_token | length >= 32
    fail_msg: "k3s_token короче 32 символов: сгенерируйте openssl rand -hex 32 и положите в vault"
    quiet: true
  no_log: true

- name: Создать каталог конфигурации k3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Записать конфиг k3s server
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  register: k3s_config
  diff: false

- name: Проверить, установлен ли k3s
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Узнать установленную версию k3s
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  when: k3s_bin.stat.exists

- name: Скачать установочный скрипт k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Установить k3s server {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  register: k3s_install
  changed_when: true
  when: >-
    not k3s_bin.stat.exists or
    k3s_version not in (k3s_installed_version.stdout | default(''))

- name: Перезапустить k3s, если конфиг изменился на уже установленном k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: k3s_config.changed and k3s_bin.stat.exists and k3s_install is skipped

- name: Включить и запустить k3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Дождаться, пока нода сервера станет Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=30s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_node_ready
  until: k3s_node_ready.rc == 0
  retries: 20
  delay: 10
  changed_when: false

# Админский kubeconfig: только для DevOps (участникам выдаются ограниченные)
- name: Создать каталог artifacts на рабочей машине
  ansible.builtin.file:
    path: "{{ artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Скачать admin kubeconfig на рабочую машину
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ artifacts_dir }}/kubeconfig-hack.yaml"
    flat: true

- name: Подставить публичный адрес сервера в kubeconfig
  ansible.builtin.replace:
    path: "{{ artifacts_dir }}/kubeconfig-hack.yaml"
    regexp: 'https://127\.0\.0\.1:{{ k3s_api_port }}'
    replace: "https://{{ ansible_host }}:{{ k3s_api_port }}"
    mode: "0600"
  delegate_to: localhost
  become: false
