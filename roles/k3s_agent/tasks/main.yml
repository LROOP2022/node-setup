- name: Проверить, что токен кластера задан и достаточно длинный
  ansible.builtin.assert:
    that: k3s_token | length >= 32
    fail_msg: "k3s_token короче 32 символов: сгенерируйте openssl rand -hex 32 и положите в vault"
    quiet: true
  no_log: true

- name: Проверить, что у ноды задана роль
  ansible.builtin.assert:
    that: node_role is defined
    fail_msg: "Для {{ inventory_hostname }} не задана node_role в inventory"
    quiet: true

- name: Создать каталог конфигурации k3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Записать конфиг k3s agent
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  register: k3s_config
  diff: false

- name: Проверить, установлен ли k3s
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Узнать установленную версию k3s
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  when: k3s_bin.stat.exists

- name: Скачать установочный скрипт k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Установить k3s agent {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
  register: k3s_install
  changed_when: true
  when: >-
    not k3s_bin.stat.exists or
    k3s_version not in (k3s_installed_version.stdout | default(''))

- name: Перезапустить k3s-agent, если конфиг изменился на уже установленном k3s
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when: k3s_config.changed and k3s_bin.stat.exists and k3s_install is skipped

- name: Включить и запустить k3s-agent
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
